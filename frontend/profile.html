<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account – ShopNest</title>
  <script>if (localStorage.theme === 'dark' || (!localStorage.theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tw-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
  <div id="app-header"></div>
  <main class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold mb-6">My account</h1>
    <div class="flex gap-2 mb-6 border-b border-slate-200 dark:border-slate-800">
      <button data-tab="profile" class="tab px-4 py-2 font-semibold border-b-2">Profile</button>
      <button data-tab="orders" class="tab px-4 py-2 font-semibold border-b-2">Order history</button>
      <button data-tab="security" class="tab px-4 py-2 font-semibold border-b-2">Password</button>
    </div>

    <section id="tab-profile" class="hidden card p-6">
      <form id="profileForm" class="grid sm:grid-cols-2 gap-4" novalidate>
        <div><label class="label" for="name">Full name</label><input class="input" id="name" required></div>
        <div><label class="label" for="email">Email (cannot be changed)</label><input class="input opacity-60" id="email" disabled></div>
        <div><label class="label" for="phone">Phone</label><input class="input" id="phone"></div>
        <div></div>
        <div class="sm:col-span-2"><label class="label" for="street">Street address</label><input class="input" id="street"></div>
        <div><label class="label" for="city">City</label><input class="input" id="city"></div>
        <div><label class="label" for="state">State / Province</label><input class="input" id="state"></div>
        <div><label class="label" for="zip">Postal code</label><input class="input" id="zip"></div>
        <div><label class="label" for="country">Country</label><input class="input" id="country"></div>
        <div class="sm:col-span-2"><button class="btn btn-primary">Save changes</button></div>
      </form>
    </section>

    <section id="tab-orders" class="hidden"><div id="ordersList"></div></section>

    <section id="tab-security" class="hidden card p-6 max-w-md">
      <form id="passwordForm" class="space-y-4" novalidate>
        <div><label class="label" for="currentPassword">Current password</label><input class="input" id="currentPassword" type="password" required></div>
        <div><label class="label" for="newPassword">New password (min 6 characters)</label><input class="input" id="newPassword" type="password" required></div>
        <button class="btn btn-primary">Update password</button>
      </form>
    </section>
  </main>
  <div id="app-footer"></div>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
