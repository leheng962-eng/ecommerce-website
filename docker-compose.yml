services:
  # ---------- MongoDB ----------
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db          # keeps your data when the container restarts
    # No "ports:" on purpose: the database is only reachable by the api container.

  # ---------- Node.js API + frontend ----------
  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "80:5000"                    # visit http://localhost  (host 80 -> container 5000)
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/shopnest   # "mongo" = the service name above
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file next to docker-compose.yml}
      JWT_EXPIRES_IN: 7d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopnest.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}

volumes:
  mongo_data:
